<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172432"/>
      <stop offset=".52" stop-color="#0D1721"/>
      <stop offset="1" stop-color="#080D13"/>
    </linearGradient>
    <radialGradient id="tealGlow">
      <stop stop-color="#20E0BA" stop-opacity=".35"/>
      <stop offset="1" stop-color="#20E0BA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberGlow">
      <stop stop-color="#FFB765" stop-opacity=".7"/>
      <stop offset="1" stop-color="#FFB765" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#151D25"/>
      <stop offset="1" stop-color="#05080C"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="1" x2="0" y2="0">
      <stop stop-color="#26D7B3"/>
      <stop offset="1" stop-color="#C8F6E9"/>
    </linearGradient>
    <filter id="shadow" x="-.2" y="-.4" width="1.4" height="1.8">
      <feGaussianBlur in="SourceAlpha" stdDeviation="24"/>
      <feOffset dy="18"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope=".45"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow" x="-.6" y="-.6" width="2.2" height="2.2">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="190" fill="url(#background)"/>
  <circle cx="512" cy="390" r="390" fill="url(#tealGlow)"/>
  <rect x="2" y="2" width="1020" height="1020" rx="188" fill="none" stroke="#C9F5EC" stroke-opacity=".12" stroke-width="4"/>
  <rect x="128" y="248" width="768" height="228" rx="114" fill="url(#pill)" stroke="#42515D" stroke-opacity=".7" stroke-width="5" filter="url(#shadow)"/>
  <path d="M248 270h528" stroke="#D8FFF6" stroke-opacity=".09" stroke-width="5" stroke-linecap="round"/>
  <g fill="url(#bars)">
    <rect x="235" y="345" width="18" height="46" rx="9"/>
    <rect x="271" y="326" width="18" height="84" rx="9"/>
    <rect x="307" y="306" width="18" height="124" rx="9"/>
    <rect x="343" y="334" width="18" height="70" rx="9"/>
    <rect x="379" y="352" width="18" height="34" rx="9"/>
  </g>
  <circle cx="758" cy="362" r="88" fill="url(#amberGlow)" filter="url(#glow)"/>
  <circle cx="758" cy="362" r="40" fill="#FFB765"/>
  <circle cx="746" cy="350" r="12" fill="#FFF2DC" fill-opacity=".72"/>
  <text x="512" y="716" text-anchor="middle" fill="#F4F7FA" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="190" font-weight="650" letter-spacing="3">Notch</text>
  <rect x="454" y="770" width="116" height="8" rx="4" fill="#FFB765"/>
</svg>
