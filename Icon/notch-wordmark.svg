<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 420">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#152230"/>
      <stop offset="1" stop-color="#080D13"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="1" x2="0" y2="0">
      <stop stop-color="#26D7B3"/>
      <stop offset="1" stop-color="#C8F6E9"/>
    </linearGradient>
    <filter id="shadow" x="-.2" y="-.4" width="1.4" height="1.8">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dy="8"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope=".4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1500" height="420" rx="54" fill="url(#background)"/>
  <rect x="35" y="35" width="350" height="350" rx="100" fill="#0C1721" stroke="#C9F5EC" stroke-opacity=".13" stroke-width="3"/>
  <rect x="75" y="137" width="270" height="110" rx="55" fill="#05080C" stroke="#42515D" stroke-opacity=".7" stroke-width="3" filter="url(#shadow)"/>
  <g fill="url(#bars)">
    <rect x="112" y="179" width="9" height="22" rx="5"/>
    <rect x="130" y="170" width="9" height="40" rx="5"/>
    <rect x="148" y="161" width="9" height="58" rx="5"/>
    <rect x="166" y="174" width="9" height="32" rx="5"/>
    <rect x="184" y="182" width="9" height="16" rx="5"/>
  </g>
  <circle cx="290" cy="192" r="31" fill="#FFB765"/>
  <circle cx="281" cy="183" r="9" fill="#FFF2DC" fill-opacity=".72"/>
  <text x="455" y="270" fill="#F4F7FA" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="206" font-weight="650" letter-spacing="2">Notch</text>
  <rect x="462" y="318" width="162" height="9" rx="5" fill="#FFB765"/>
</svg>
